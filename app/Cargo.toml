[package]
name = "bplus"
version = "1.0.0"
edition = "2024"
description = "Bplus Rename - rename many files and folders at once"

[[bin]]
name = "bplus"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "glow", "accesskit"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
regex = "1"
png = "0.18"
rfd = "0.17.2"

[build-dependencies]
winresource = "0.1.34"

[profile.release]
opt-level = 3
strip = true
